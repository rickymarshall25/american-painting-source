<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>American Painting Source | Arizona's Trusted Painting Experts</title>
<meta name="description" content="Custom home quality. Everyday prices. Arizona's most trusted residential and commercial painting company. ROC #355921."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#c0392b;--dark:#1a1a1a;--white:#fff;--gray:#f5f5f5;--text:#333}
body{font-family:'Inter',sans-serif;color:var(--text);background:#fff}
a{text-decoration:none;color:inherit}
img{max-width:100%}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(26,26,26,0.97);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.07)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:12px}
.nav-logo img{height:48px;width:48px;border-radius:50%;object-fit:cover}
.nav-logo-text{color:#fff;font-weight:800;font-size:1rem;line-height:1.2}
.nav-logo-text span{color:var(--red)}
.nav-links{display:flex;gap:8px;align-items:center}
.nav-links a{color:rgba(255,255,255,0.8);font-size:.875rem;font-weight:500;padding:6px 12px;border-radius:6px;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-cta{background:var(--red);color:#fff!important;padding:8px 18px!important;border-radius:6px!important;font-weight:700!important}
.nav-cta:hover{background:#a93226!important}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hamburger span{display:block;width:24px;height:2px;background:#fff;transition:.3s}
.mobile-menu{display:none;position:fixed;top:68px;left:0;right:0;background:var(--dark);padding:16px 24px 24px;z-index:99;border-bottom:1px solid rgba(255,255,255,0.1)}
.mobile-menu a{display:block;color:rgba(255,255,255,0.85);font-size:1rem;font-weight:500;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.07)}
.mobile-menu a:last-child{border:none;margin-top:8px;background:var(--red);color:#fff;text-align:center;padding:12px;border-radius:8px}
.page{display:none;padding-top:68px}
.page.active{display:block}
.hero{position:relative;min-height:calc(100vh - 68px);display:flex;align-items:flex-start;overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center top}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(26,26,26,.95) 0%,rgba(26,26,26,.80) 50%,rgba(26,26,26,.35) 100%)}
